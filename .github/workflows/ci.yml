concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          load: true
          platforms: linux/amd64
          pull: true
          tags: wacli-api-smoke:ci
      - name: Verify API authentication, messaging and persistence
        run: python3 tests/smoke.py wacli-api-smoke:ci
    timeout-minutes: 20

name: CI

on:
  pull_request:

permissions:
  contents: read
