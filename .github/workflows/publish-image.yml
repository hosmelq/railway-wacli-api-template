concurrency:
  group: publish-image-${{ github.ref }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          platforms: linux/amd64
          pull: true
          tags: wacli-api-smoke:ci
      - name: Verify API authentication, messaging and persistence
        run: python3 tests/smoke.py wacli-api-smoke:ci
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        name: Publish verified image
        run: |
          docker tag wacli-api-smoke:ci "$IMAGE:sha-$REVISION"
          docker tag wacli-api-smoke:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:latest"
    timeout-minutes: 20

name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
